# Environment: dev
catalog: "oil_gas_demo"

# Data paths
source_csv: "/Volumes/oil_gas_demo/raw/raw_volume/supply_chain_dataset.csv"

# Tables
tables:
  bronze: "oil_gas_demo.bronze.supply_chain_transactions"
  silver: "oil_gas_demo.silver.supply_chain_transactions"
  gold_agg: "oil_gas_demo.gold.daily_demand_agg"
  gold_features: "oil_gas_demo.gold.demand_features"
  feature_store: "oil_gas_demo.gold.demand_feature_store"
  labels: "oil_gas_demo.gold.demand_labels"
  training_data: "oil_gas_demo.ml_model.training_data"
  validation_data: "oil_gas_demo.ml_model.validation_data"
  testing_data: "oil_gas_demo.ml_model.testing_data"
  predictions: "oil_gas_demo.ml_model.predictions"
  eval_predictions: "oil_gas_demo.ml_model.model_predictions_eval"

# ML configuration
ml:
  model_name: "oil_gas_demo.ml_model.random_forest_demand"
  model_alias: "dev"
  experiment_name: "/Shared/demand_forecasting_experiment"
  
  # Train/val/test split ratios (chronological)
  split:
    train: 0.64
    val: 0.16
    test: 0.20
  
  # RandomForest hyperparameters
  rf:
    n_estimators: 200
    random_state: 42
    n_jobs: -1
  
  # Feature columns
  features:
    time_series: ["demand_lag_1", "demand_lag_7", "rolling_avg_7"]
    categorical: ["product_name", "destination_city"]
    drop_cols: ["feature_uid", "transaction_date", "total_demand", "product_name", "destination_city"]